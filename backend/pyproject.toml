[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotome"
dynamic = ["version"]
description = "Open a PyTorch model and see every signal: computation graph, activations and attribution in one UI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  # TorchLens changes its API between minor versions; the adapter in
  # neurotome/capture.py is written against 2.34. Bump deliberately.
  "torchlens>=2.34,<2.35",
  "captum>=0.9,<0.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pyright>=1.1.390", "build>=1.2"]
# hf:<repo_id> model specs (tokenizers, image processors); imported lazily by neurotome/models.py
hf = ["transformers>=4.56", "accelerate>=1.0"]  # 4.56: from_pretrained(dtype=), set_attn_implementation
# the NNsight capture backend (module outputs); imported lazily by neurotome/capture_nnsight.py
nnsight = ["nnsight>=0.7,<0.8"]
# docs site tooling; never imported by the package
docs = ["mkdocs-material>=9.5", "mike>=2.1"]

[project.scripts]
neurotome = "neurotome.cli:main"

[tool.setuptools.dynamic]
version = {attr = "neurotome.__version__"}

[tool.setuptools.packages.find]
include = ["neurotome*"]

[tool.setuptools.package-data]
neurotome = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI File(...) defaults
